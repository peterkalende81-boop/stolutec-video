<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solutec Digital — Avatar 3D HTML</title>
<style>
:root{--bg:#090b13;--cyan:#6ff7ff;--violet:#8b5cf6;--blue:#3b82f6;--skin:#8d5b48;--skin2:#b8795e;--shirt:#f5f7fb;--pants:#151a2c;--red:#ff4d5f;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 18%,#182047 0,#0c1020 38%,var(--bg) 72%);font-family:system-ui,sans-serif;color:#fff}.scene{position:relative;width:100vw;height:100vh;display:grid;place-items:center;perspective:1200px;overflow:hidden}.grid{position:absolute;inset:auto -20% -28%;height:55%;transform:perspective(700px) rotateX(68deg);background:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(transparent,#000)}.glow{position:absolute;width:48vmin;height:48vmin;border-radius:50%;background:radial-gradient(circle,#6ff7ff22,transparent 65%);filter:blur(8px)}.avatar{position:relative;width:260px;height:640px;transform-style:preserve-3d;animation:float 4.8s ease-in-out infinite}.avatar *{position:absolute;transform-style:preserve-3d}.head{width:122px;height:142px;left:69px;top:16px;border-radius:48% 48% 44% 44%;background:linear-gradient(120deg,var(--skin2),var(--skin));box-shadow:inset -12px -12px 18px #0003,0 14px 35px #0008;animation:headTalk 2.8s ease-in-out infinite}.hair{inset:-7px 8px auto 7px;height:62px;border-radius:55% 55% 35% 35%;background:#15110f;transform:translateZ(5px)}.ear{width:18px;height:34px;top:59px;border-radius:50%;background:var(--skin);z-index:-1}.ear.l{left:-8px}.ear.r{right:-8px}.eye{width:14px;height:9px;top:67px;border-radius:50%;background:#16110e;animation:blink 4.2s infinite}.eye.l{left:29px}.eye.r{right:29px}.brow{width:25px;height:5px;top:57px;border-radius:10px;background:#201612}.brow.l{left:24px;transform:rotate(5deg)}.brow.r{right:24px;transform:rotate(-5deg)}.nose{width:10px;height:24px;left:56px;top:75px;border-right:2px solid #704737;border-radius:40%;transform:rotate(8deg)}.mouth{width:36px;height:11px;left:43px;top:111px;border-bottom:3px solid #5d2f2b;border-radius:0 0 50% 50%;animation:speak .28s infinite alternate}.neck{width:48px;height:44px;left:106px;top:135px;background:var(--skin);border-radius:0 0 14px 14px}.torso{width:142px;height:205px;left:59px;top:164px;background:linear-gradient(90deg,#fff,#e6e9f2);border-radius:30px 30px 20px 20px;box-shadow:0 25px 40px #0007}.collar{width:54px;height:45px;left:44px;top:-1px;border-left:3px solid #d6dae4;border-right:3px solid #d6dae4;transform:skewX(-8deg)}.chest{left:63px;top:74px;width:18px;height:18px;border-radius:50%;background:#d9ddea}.arm{width:42px;height:195px;top:178px;border-radius:22px;background:linear-gradient(90deg,var(--shirt),#cdd3df);transform-origin:21px 20px}.arm.l{left:31px;animation:gestureL 3.2s ease-in-out infinite}.arm.r{right:31px;animation:gestureR 3.2s ease-in-out .2s infinite}.forearm{width:40px;height:145px;top:165px;left:1px;border-radius:21px;background:linear-gradient(90deg,var(--shirt),#cdd3df);transform-origin:20px 12px}.hand{width:39px;height:47px;left:1px;top:287px;border-radius:45% 45% 50% 50%;background:linear-gradient(120deg,var(--skin2),var(--skin));box-shadow:inset -6px -5px 8px #0002}.finger{width:8px;height:25px;top:7px;border-radius:8px;background:var(--skin2)}.finger:nth-child(1){left:4px;transform:rotate(-10deg)}.finger:nth-child(2){left:12px;top:2px}.finger:nth-child(3){left:20px;top:4px}.finger:nth-child(4){left:28px;top:9px;transform:rotate(12deg)}.hips{width:126px;height:40px;left:67px;top:350px;background:#11172a;border-radius:8px}.leg{width:54px;height:225px;top:374px;background:linear-gradient(90deg,#1d2338,#0c1120);border-radius:16px 16px 22px 22px;transform-origin:27px 12px}.leg.l{left:69px;animation:walkL 3.8s ease-in-out infinite}.leg.r{right:69px;animation:walkR 3.8s ease-in-out infinite}.shoe{width:70px;height:30px;left:-8px;bottom:-12px;border-radius:20px 24px 12px 12px;background:#070a12;box-shadow:0 7px 15px #0008}.floor-shadow{position:absolute;width:260px;height:50px;bottom:14%;border-radius:50%;background:#0009;filter:blur(16px);animation:shadow 4.8s ease-in-out infinite}.speech{position:absolute;right:8%;top:14%;width:min(330px,34vw);padding:22px 24px;border:1px solid #ffffff18;border-radius:22px;background:#111729cc;backdrop-filter:blur(16px);box-shadow:0 25px 70px #0005}.speech b{color:var(--cyan);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.speech h1{font-size:clamp(1.4rem,2.7vw,2.6rem);line-height:1;margin:9px 0}.speech p{color:#aeb6ca;font-size:.88rem}.wave{display:flex;gap:4px;height:20px;align-items:center;margin-top:14px}.wave i{width:3px;height:8px;background:var(--cyan);border-radius:3px;animation:wave .65s ease-in-out infinite alternate}.wave i:nth-child(2){animation-delay:.1s;height:15px}.wave i:nth-child(3){animation-delay:.2s;height:20px}.wave i:nth-child(4){animation-delay:.3s;height:12px}.wave i:nth-child(5){animation-delay:.4s;height:17px}.platforms{position:absolute;left:7%;top:18%;display:flex;flex-direction:column;gap:10px}.chip{padding:9px 13px;border-radius:999px;background:#ffffff0a;border:1px solid #ffffff12;color:#cbd4e8;font-size:.72rem;backdrop-filter:blur(10px);animation:chip 3s ease-in-out infinite}.chip:nth-child(2){animation-delay:.6s}.chip:nth-child(3){animation-delay:1.2s}.hint{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);color:#7e89a5;font-size:.7rem;text-align:center}
@keyframes float{50%{transform:translateY(-12px) rotateY(2deg)}}@keyframes headTalk{50%{transform:rotate(1.2deg) translateY(-1px)}}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}@keyframes speak{from{height:7px}to{height:14px}}@keyframes gestureL{0%,100%{transform:rotate(16deg)}25%{transform:rotate(42deg) translate(-6px,5px)}55%{transform:rotate(24deg) translate(4px,-2px)}80%{transform:rotate(48deg) translate(-3px,7px)}}@keyframes gestureR{0%,100%{transform:rotate(-14deg)}30%{transform:rotate(-40deg) translate(5px,3px)}58%{transform:rotate(-24deg) translate(-4px,-4px)}84%{transform:rotate(-47deg) translate(4px,6px)}}@keyframes walkL{50%{transform:rotate(2deg) translateY(3px)}}@keyframes walkR{50%{transform:rotate(-2deg) translateY(-2px)}}@keyframes shadow{50%{transform:scale(.88);opacity:.6}}@keyframes wave{to{transform:scaleY(.35)}}@keyframes chip{50%{transform:translateX(6px)}}
@media(max-width:700px){.avatar{transform:scale(.72);margin-top:70px}.speech{right:50%;top:5%;transform:translateX(50%);width:min(330px,82vw)}.platforms{left:5%;bottom:10%;top:auto}.chip{font-size:.62rem;padding:7px 10px}.hint{bottom:3%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head><body>
<div class="scene"><div class="grid"></div><div class="glow"></div><div class="floor-shadow"></div>
<div class="platforms"><div class="chip">● Facebook</div><div class="chip">◎ Instagram</div><div class="chip">♪ TikTok</div></div>
<div class="avatar" aria-label="Avatar humanoïde animé"><div class="head"><div class="hair"></div><div class="ear l"></div><div class="ear r"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div></div><div class="neck"></div><div class="torso"><div class="collar"></div><div class="chest"></div></div><div class="arm l"><div class="forearm"><div class="hand"><i class="finger"></i><i class="finger"></i><i class="finger"></i><i class="finger"></i></div></div></div><div class="arm r"><div class="forearm"><div class="hand"><i class="finger"></i><i class="finger"></i><i class="finger"></i><i class="finger"></i></div></div></div><div class="hips"></div><div class="leg l"><div class="shoe"></div></div><div class="leg r"><div class="shoe"></div></div></div>
<div class="speech"><b>Solutec Digital · IA</b><h1>Transforme uma ideia numa mensagem que vende.</h1><p>Avatar, vídeo vertical, movimento e narrativa pensados para prender atenção nas redes sociais.</p><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="hint">Avatar experimental em HTML + CSS · microexpressões · gestos · responsivo</div>
</div>
</body></html>
